[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-water-human"
version = "0.1.0"
description = "Global Climate–Water–Human framework: GEMStat V3 acquisition, cleaning and audit pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "duckdb>=1.1,<2",
    "pyarrow>=14",
    "requests>=2.31",
    "matplotlib>=3.7",
    "folium>=0.15",
    "jinja2>=3.0",
    "xlsxwriter>=3.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7", "ruff>=0.4", "nbformat>=5", "nbconvert>=7", "ipykernel>=6"]

[project.scripts]
cwh-audit = "climate_water_human.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climate_water_human = ["templates/*.j2"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
